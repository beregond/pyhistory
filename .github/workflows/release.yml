name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    if: github.repository == 'beregond/pyhistory'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: release-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            release-

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U build twine
          pip install .[dev]

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      # Version comes from the git tag (versioningit), so make sure the built
      # packages carry exactly the tag's version (e.g. not "2.4.0.post1+g...").
      - name: Verify built version matches tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          ls dist/
          if [ ! -f "dist/pyhistory-${TAG}.tar.gz" ] || ! ls "dist/pyhistory-${TAG}-"*.whl >/dev/null 2>&1; then
            echo "Built packages do not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi

      - name: Upload packages to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
