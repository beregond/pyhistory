[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "pyhistory"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
dynamic = ["version"]
description = """
  PyHistory maintains history entries in distributed work environment,
  which allows many developers to add/remove history entries between releases without conflicts.
"""
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = ["click", "toml"]
authors = [{ name = "Szczepan Cieślik", email = "szczepan.cieslik@gmail.com" }]

[project.scripts]
pyhistory = "pyhistory.cli:main"
pyhi = "pyhistory.cli:main"

[project.optional-dependencies]
dev = ["coverage", "mccabe", "pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-mdinclude"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]
default-version = "0.0.0"

[tool.versioningit.write]
file = "src/pyhistory/_version.py"

[tool.pyhistory]
history_file = "HISTORY.rst"
